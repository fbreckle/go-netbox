name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml

      - name: Pull go-swagger
        run: docker pull quay.io/goswagger/swagger:v0.36.5

      - name: Check generated client matches tracked spec
        run: |
          make check swagger="docker run --rm --env GOPATH=${HOME}/go:/go --user $(id -u):$(id -g) --volume ${HOME}:${HOME} --workdir ${PWD} quay.io/goswagger/swagger:v0.36.5"
